name: Check and deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      deployable: ${{ steps.paths.outputs.deployable }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - id: paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo "deployable=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE_SHA" HEAD | awk '/(^|\/)AGENTS\.md$/ || !/\.md$/ { changed=1 } END { exit !changed }'; then
            echo "deployable=true" >> "$GITHUB_OUTPUT"
          else
            echo "deployable=false" >> "$GITHUB_OUTPUT"
          fi
  check:
    needs: changes
    if: needs.changes.outputs.deployable == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build
      - if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        name: Deploy the demo
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          SYDNEY_FEEDBACK_GITHUB_TOKEN: ${{ secrets.SYDNEY_FEEDBACK_GITHUB_TOKEN }}
        run: |
          test -n "$SYDNEY_FEEDBACK_GITHUB_TOKEN"
          printf '%s\n' 'GITHUB_TOKEN=$SYDNEY_FEEDBACK_GITHUB_TOKEN' > "$RUNNER_TEMP/sydney-secrets.env"
          pnpm exec cf deploy --prebuilt --secrets-file "$RUNNER_TEMP/sydney-secrets.env"
